
name: Analyze Shadowrocket Subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run subscription analyzer
        run: python analyze.py

      - name: Run GeoIP analyzer
        run: python geoip.py

      - name: Upload analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: subscription-analysis
          path: |
            report.json
            geoip-report.json

      - name: Save reports
        run: |
          mkdir -p reports
          cp report.json reports/latest.json
          cp geoip-report.json reports/latest-geoip.json

      - name: Commit reports and cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest.json reports/latest-geoip.json geoip-cache.json geoip-state.json
          git diff --cached --quiet || git commit -m "Update subscription and GeoIP reports"
          git push
